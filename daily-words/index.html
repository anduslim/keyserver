<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Daily Words</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", Arial, sans-serif; text-align: center;
         background: #fff8e1; margin: 0; padding: 12px; color: #4e342e; user-select: none; }
  button { font-family: inherit; cursor: pointer; }

  #top { display: flex; justify-content: space-between; align-items: center; max-width: 600px;
         margin: 0 auto; font-size: 22px; }
  #dots { display: flex; gap: 8px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #ffe0b2; }
  .dot.done { background: #66bb6a; }
  .dot.now { outline: 3px solid #ff7043; }

  #pic { font-size: 130px; line-height: 1.1; margin-top: 10px; cursor: pointer; display: inline-block; }
  #pic.bounce { animation: bounce .6s; }
  #hint-text { font-size: 18px; color: #a1887f; margin-bottom: 6px; }

  #slots { display: flex; justify-content: center; gap: 8px; margin: 10px 0 14px; }
  .slot { width: clamp(48px, 15vw, 76px); height: clamp(60px, 18vw, 90px); border-bottom: 6px solid #bcaaa4;
          font-size: clamp(40px, 12vw, 64px); color: #d7ccc8; display: flex; align-items: flex-end;
          justify-content: center; }
  .slot.filled { color: #2e7d32; border-color: #66bb6a; animation: pop .25s; }

  #tiles { min-height: 110px; }
  .tile { font-size: clamp(36px, 11vw, 50px); width: clamp(64px, 20vw, 90px); height: clamp(64px, 20vw, 90px);
          margin: 6px; border: none; border-radius: 20px; background: #42a5f5; color: white;
          box-shadow: 0 6px 0 #1e88e5; }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e88e5; }
  .tile.wrong { background: #ef5350; box-shadow: 0 6px 0 #c62828; animation: shake .4s; }
  .tile.hint { animation: pulse 1s infinite; background: #ffca28; box-shadow: 0 6px 0 #ffa000; }

  #msg { font-size: 34px; min-height: 48px; margin: 8px 0; }
  .big { font-size: 28px; padding: 12px 34px; border-radius: 18px; border: none; background: #ff7043;
         color: white; box-shadow: 0 6px 0 #e64a19; margin: 6px; }
  .big.alt { background: #ab47bc; box-shadow: 0 6px 0 #7b1fa2; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #e64a19; }
  #next { visibility: hidden; }

  .screen { display: none; }
  .screen.on { display: block; }
  #start h1, #done h1 { font-size: 42px; margin: 20px 0 6px; }
  #start .emoji { font-size: 90px; }
  #start p, #done p { font-size: 22px; }
  #learned { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px auto; max-width: 600px; }
  .learned { background: white; border-radius: 18px; padding: 10px 14px; font-size: 24px; border: none;
             box-shadow: 0 4px 0 #ffe0b2; min-width: 110px; }
  .learned span { display: block; font-size: 54px; }

  @keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  @keyframes bounce { 30% { transform: translateY(-25px) scale(1.1); } 60% { transform: translateY(0); } }
</style>
</head>
<body>

<!-- Start screen: a tap is needed before browsers allow speech -->
<div id="start" class="screen on">
  <div class="emoji">🦉</div>
  <h1>Daily Words</h1>
  <p id="today-label"></p>
  <p id="streak-label"></p>
  <button class="big" onclick="begin()">▶ Let's go!</button>
</div>

<!-- Play screen -->
<div id="play" class="screen">
  <div id="top">
    <span id="stars">⭐ 0</span>
    <div id="dots"></div>
    <span id="streak">🔥 0</span>
  </div>
  <div id="pic" title="Tap to hear the word"></div>
  <div id="hint-text">Tap the picture to hear it again</div>
  <div id="slots"></div>
  <div id="tiles"></div>
  <div id="msg"></div>
  <button id="next" class="big" onclick="nextWord()">Next ➜</button>
</div>

<!-- Finished screen -->
<div id="done" class="screen">
  <h1>🎉 You did it! 🎉</h1>
  <p>Today you learned:</p>
  <div id="learned"></div>
  <p id="done-streak"></p>
  <p>Come back tomorrow for new words!</p>
  <button class="big" onclick="playAgain()">🔁 Play again</button>
  <button class="big alt" onclick="bonusWord()">🎁 Bonus word</button>
</div>

<script>
  // ---------- Word bank ----------
  // Easy words (3 letters) and harder words (4–5 letters), each with a picture and a short sentence.
  const EASY = [
    { w: "cat", pic: "🐱", s: "The cat says meow." },
    { w: "dog", pic: "🐶", s: "The dog says woof." },
    { w: "sun", pic: "☀️", s: "The sun is hot." },
    { w: "bus", pic: "🚌", s: "We ride the bus." },
    { w: "pig", pic: "🐷", s: "The pig is pink." },
    { w: "cow", pic: "🐮", s: "The cow says moo." },
    { w: "bed", pic: "🛏️", s: "I sleep in my bed." },
    { w: "egg", pic: "🥚", s: "The hen lays an egg." },
    { w: "box", pic: "📦", s: "The toy is in the box." },
    { w: "fox", pic: "🦊", s: "The fox is orange." },
    { w: "bee", pic: "🐝", s: "The bee says buzz." },
    { w: "ant", pic: "🐜", s: "The ant is small." },
    { w: "owl", pic: "🦉", s: "The owl says hoot." },
    { w: "key", pic: "🔑", s: "The key opens the door." },
    { w: "car", pic: "🚗", s: "The car goes fast." },
    { w: "hat", pic: "🎩", s: "I wear a hat." },
    { w: "cup", pic: "🥤", s: "I drink from a cup." },
    { w: "red", pic: "🔴", s: "The apple is red." },
    { w: "hot", pic: "🔥", s: "Fire is hot." },
    { w: "ice", pic: "🧊", s: "Ice is cold." },
    { w: "run", pic: "🏃", s: "I can run fast." },
    { w: "yes", pic: "👍", s: "Yes, please." },
    { w: "map", pic: "🗺️", s: "Look at the map." },
    { w: "bat", pic: "🦇", s: "The bat flies at night." },
    { w: "pen", pic: "🖊️", s: "I write with a pen." },
    { w: "zoo", pic: "🦒", s: "We see animals at the zoo." },
    { w: "web", pic: "🕸️", s: "The spider makes a web." },
    { w: "toy", pic: "🧸", s: "I play with my toy." }
  ];
  const HARD = [
    { w: "ball", pic: "⚽", s: "Kick the ball." },
    { w: "fish", pic: "🐟", s: "The fish can swim." },
    { w: "frog", pic: "🐸", s: "The frog can jump." },
    { w: "duck", pic: "🦆", s: "The duck says quack." },
    { w: "cake", pic: "🎂", s: "I like birthday cake." },
    { w: "book", pic: "📖", s: "I read a book." },
    { w: "star", pic: "⭐", s: "The star shines at night." },
    { w: "moon", pic: "🌙", s: "The moon is in the sky." },
    { w: "tree", pic: "🌳", s: "The tree is tall." },
    { w: "ship", pic: "🚢", s: "The ship sails on the sea." },
    { w: "milk", pic: "🥛", s: "I drink milk." },
    { w: "bird", pic: "🐦", s: "The bird can fly." },
    { w: "door", pic: "🚪", s: "Open the door." },
    { w: "hand", pic: "✋", s: "Wave your hand." },
    { w: "rain", pic: "🌧️", s: "The rain is wet." },
    { w: "lion", pic: "🦁", s: "The lion says roar." },
    { w: "bear", pic: "🐻", s: "The bear is big." },
    { w: "shoe", pic: "👟", s: "Put on your shoe." },
    { w: "sock", pic: "🧦", s: "I have a red sock." },
    { w: "stop", pic: "🛑", s: "Stop at the red light." },
    { w: "apple", pic: "🍎", s: "I eat an apple." },
    { w: "house", pic: "🏠", s: "This is my house." },
    { w: "horse", pic: "🐴", s: "The horse can run." },
    { w: "train", pic: "🚆", s: "The train goes choo choo." },
    { w: "bread", pic: "🍞", s: "I eat bread." },
    { w: "snake", pic: "🐍", s: "The snake says hiss." },
    { w: "mouse", pic: "🐭", s: "The mouse says squeak." },
    { w: "plane", pic: "✈️", s: "The plane flies high." },
    { w: "smile", pic: "😊", s: "I smile when I am happy." },
    { w: "heart", pic: "❤️", s: "I love you with all my heart." }
  ];
  const EASY_PER_DAY = 3, HARD_PER_DAY = 2;

  // ---------- Daily selection ----------
  // Each word list is shuffled once with a fixed seed, then each day takes the next slice,
  // so every word appears before any word repeats and everyone gets the same words on the same day.
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed) {
    const a = arr.slice(), r = rng(seed);
    for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; }
    return a;
  }
  function slice(list, count, day, seed) {
    const order = seededShuffle(list, seed), out = [];
    for (let k = 0; k < count; k++) out.push(order[(day * count + k) % order.length]);
    return out;
  }
  const now = new Date();
  const todayKey = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
  const dayNum = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  const yesterdayKey = (() => { const d = new Date(now); d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); })();
  const todaysWords = slice(EASY, EASY_PER_DAY, dayNum, 7).concat(slice(HARD, HARD_PER_DAY, dayNum, 11));

  // ---------- Saved progress (best effort; the game works without it) ----------
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  let progress = load("dw-progress", { stars: 0, streak: 0, lastDay: null });
  let doneToday = load("dw-day-" + todayKey, []);

  // ---------- Speech ----------
  let voice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /en[-_]US/i.test(v.lang) && /female|samantha|google/i.test(v.name))
         || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text, rate) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate || 0.8; u.pitch = 1.1;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  // ---------- Game ----------
  let list = todaysWords, i = 0, typed = "", misses = 0, bonus = false;
  const $ = id => document.getElementById(id);
  const cheers = ["Great job!", "Super!", "Well done!", "Awesome!", "You did it!", "Fantastic!"];

  function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

  function begin() {
    say("Hello! Let's learn some words.");
    // Start at the first word not finished today
    i = todaysWords.findIndex(x => !doneToday.includes(x.w));
    if (i === -1) { showDone(); return; }
    list = todaysWords; bonus = false;
    show("play");
    setTimeout(loadWord, 1200);
  }

  function shuffle(letters) {
    const word = letters.join("");
    let out = letters;
    for (let tries = 0; tries < 20 && (tries === 0 || (out.join("") === word && letters.length > 1)); tries++)
      out = seededShuffle(letters, Math.floor(Math.random() * 1e9));
    return out;
  }

  function renderTop() {
    $("stars").textContent = "⭐ " + progress.stars;
    $("streak").textContent = "🔥 " + progress.streak;
    const dots = $("dots"); dots.innerHTML = "";
    if (bonus) return;
    todaysWords.forEach((x, k) => {
      const d = document.createElement("div");
      d.className = "dot" + (doneToday.includes(x.w) ? " done" : "") + (k === i ? " now" : "");
      dots.appendChild(d);
    });
  }

  function loadWord() {
    const cur = list[i];
    typed = ""; misses = 0;
    renderTop();
    $("pic").textContent = cur.pic;
    $("msg").textContent = "";
    $("next").style.visibility = "hidden";

    const slots = $("slots"); slots.innerHTML = "";
    cur.w.toUpperCase().split("").forEach(l => {
      const s = document.createElement("div");
      s.className = "slot"; s.textContent = l; // faint letter as a guide
      slots.appendChild(s);
    });

    const box = $("tiles"); box.innerHTML = "";
    shuffle(cur.w.toUpperCase().split("")).forEach(l => {
      const b = document.createElement("button");
      b.className = "tile"; b.textContent = l;
      b.onclick = () => tap(l, b);
      box.appendChild(b);
    });
    sayWord();
  }

  function sayWord() {
    const cur = list[i];
    $("pic").classList.remove("bounce"); void $("pic").offsetWidth; $("pic").classList.add("bounce");
    say(cur.w + ". " + cur.s + " " + cur.w + ".");
  }

  function tap(letter, btn) {
    const target = list[i].w.toUpperCase();
    if (typed === target) return;
    if (letter === target[typed.length]) {
      say(letter, 1);
      document.querySelectorAll(".tile.hint").forEach(t => t.classList.remove("hint"));
      $("slots").children[typed.length].classList.add("filled");
      typed += letter; misses = 0;
      btn.style.visibility = "hidden";
      if (typed === target) finishWord();
    } else {
      say("Oops! Try again.", 1);
      btn.classList.add("wrong");
      setTimeout(() => btn.classList.remove("wrong"), 400);
      if (++misses >= 2) showHint();
    }
  }

  function showHint() {
    const need = list[i].w.toUpperCase()[typed.length];
    const tile = [...document.querySelectorAll(".tile")].find(t => t.style.visibility !== "hidden" && t.textContent === need);
    if (tile) tile.classList.add("hint");
  }

  function finishWord() {
    const cur = list[i];
    const cheer = cheers[Math.floor(Math.random() * cheers.length)];
    $("msg").textContent = "🎉 " + cheer + " ⭐";
    progress.stars++;
    if (!bonus && !doneToday.includes(cur.w)) { doneToday.push(cur.w); save("dw-day-" + todayKey, doneToday); }
    if (!bonus && doneToday.length === todaysWords.length && progress.lastDay !== todayKey) {
      progress.streak = progress.lastDay === yesterdayKey ? progress.streak + 1 : 1;
      progress.lastDay = todayKey;
    }
    save("dw-progress", progress);
    renderTop();
    setTimeout(() => say(cheer + " " + cur.w.split("").join(", ") + ". " + cur.w + "!"), 500);
    $("next").style.visibility = "visible";
  }

  function nextWord() {
    if (bonus) { bonusWord(); return; }
    const k = todaysWords.findIndex(x => !doneToday.includes(x.w));
    if (k === -1) { showDone(); return; }
    i = k; loadWord();
  }

  function showDone() {
    show("done");
    const box = $("learned"); box.innerHTML = "";
    todaysWords.forEach(x => {
      const b = document.createElement("button");
      b.className = "learned";
      b.innerHTML = "<span>" + x.pic + "</span>" + x.w;
      b.onclick = () => say(x.w + ". " + x.s);
      box.appendChild(b);
    });
    $("done-streak").textContent = "🔥 " + progress.streak + " day" + (progress.streak === 1 ? "" : "s") + " in a row!  ⭐ " + progress.stars + " stars";
    say("You did it! You learned " + todaysWords.length + " words today. Tap a picture to hear it again.");
  }

  function playAgain() {
    list = todaysWords; bonus = false;
    doneToday = []; save("dw-day-" + todayKey, doneToday);
    i = 0; show("play"); loadWord();
  }

  function bonusWord() {
    const pool = EASY.concat(HARD).filter(x => !todaysWords.includes(x));
    list = [pool[Math.floor(Math.random() * pool.length)]];
    i = 0; bonus = true; show("play"); loadWord();
  }

  $("pic").onclick = sayWord;

  // Start screen labels
  $("today-label").textContent = doneToday.length >= todaysWords.length
    ? "You finished today's words! 🌟"
    : todaysWords.length + " new words today: " + todaysWords.map(x => x.pic).join(" ");
  $("streak-label").textContent = progress.streak ? "🔥 " + progress.streak + " day streak  ⭐ " + progress.stars : "";
</script>
</body>
</html>
