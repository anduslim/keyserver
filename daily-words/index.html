<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8e1">
<title>Daily Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8e1;
    --card: #ffffff;
    --card-edge: #ffe0b2;
    --ink: #4e342e;
    --muted: #795548;
    --guide: #d7ccc8;
    --line: #bcaaa4;
    --good: #2e7d32;
    --good-soft: #66bb6a;
    --tile: #1976d2;
    --tile-edge: #0d47a1;
    --wrong: #d32f2f;
    --wrong-edge: #8e0000;
    --hint: #ffca28;
    --hint-edge: #ff8f00;
    --go: #e64a19;
    --go-edge: #a52a00;
    --alt: #8e24aa;
    --alt-edge: #5c007a;

    /* Sizes scale with the smaller of width and height so nothing overflows */
    --pic: clamp(84px, min(34vw, 24vh), 200px);
    --tile-size: clamp(52px, min(16vw, 12vh), 96px);
    --tile-font: calc(var(--tile-size) * 0.56);
    --slot-w: clamp(44px, min(14vw, 10vh), 80px);
    --slot-font: calc(var(--slot-w) * 0.86);
    --gap: clamp(8px, 1.6vw, 14px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Andika", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif; text-align: center;
         background: var(--bg); color: var(--ink); user-select: none; -webkit-user-select: none;
         touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  button:focus-visible { outline: 4px solid var(--alt); outline-offset: 4px; }

  /* ---------- Screens ---------- */
  .screen { display: none; min-height: 100vh; min-height: 100dvh; width: 100%; max-width: 1100px; margin: 0 auto;
            padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                     max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .screen.on { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  h1 { font-size: clamp(32px, 7vw, 56px); margin: 0; line-height: 1.1; }
  p { font-size: clamp(18px, 3.4vw, 24px); margin: 0; }

  /* ---------- Start ---------- */
  #start .mascot { font-size: clamp(72px, min(26vw, 20vh), 140px); line-height: 1; }
  #today-row { font-size: clamp(32px, 9vw, 52px); letter-spacing: 6px; }
  #streak-label:empty { display: none; }

  /* ---------- Play ---------- */
  #play.on { justify-content: flex-start; }
  #top { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 720px;
         font-size: clamp(18px, 3.6vw, 26px); font-weight: 700; }
  #top span { background: var(--card); border-radius: 999px; padding: 4px 14px; box-shadow: 0 3px 0 var(--card-edge); }
  #dots { display: flex; gap: 8px; }
  .dot { width: clamp(14px, 3vw, 20px); height: clamp(14px, 3vw, 20px); border-radius: 50%; background: var(--card-edge); }
  .dot.done { background: var(--good-soft); }
  .dot.now { outline: 3px solid var(--go); outline-offset: 2px; }

  .stage { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: clamp(8px, 2vh, 20px); }
  .picture { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #pic { font-size: var(--pic); line-height: 1.1; background: var(--card); border: none; border-radius: 32px;
         padding: 8px clamp(16px, 4vw, 32px); box-shadow: 0 6px 0 var(--card-edge); }
  #pic.bounce { animation: bounce .6s; }
  .hint-text { font-size: clamp(15px, 2.8vw, 19px); color: var(--muted); }
  .kbd { display: none; }

  .spell { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 18px); width: 100%; }
  #slots { display: flex; justify-content: center; gap: var(--gap); }
  .slot { width: var(--slot-w); height: calc(var(--slot-w) * 1.2); border-bottom: 6px solid var(--line);
          font-size: var(--slot-font); line-height: 1; color: var(--guide); font-weight: 700;
          display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
  .slot.filled { color: var(--good); border-color: var(--good-soft); animation: pop .25s; }

  #tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap);
           min-height: calc(var(--tile-size) + 8px); max-width: 640px; }
  .tile { font-size: var(--tile-font); font-weight: 700; width: var(--tile-size); height: var(--tile-size);
          border: none; border-radius: 22%; background: var(--tile); color: #fff; box-shadow: 0 6px 0 var(--tile-edge);
          transition: transform .08s; }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--tile-edge); }
  .tile.used { visibility: hidden; }
  .tile.wrong { background: var(--wrong); box-shadow: 0 6px 0 var(--wrong-edge); animation: shake .4s; }
  .tile.hint { background: var(--hint); color: var(--ink); box-shadow: 0 6px 0 var(--hint-edge); animation: pulse 1s infinite; }

  #msg { font-size: clamp(24px, 5vw, 36px); font-weight: 700; min-height: 1.3em; }
  .big { font-size: clamp(22px, 4.4vw, 30px); font-weight: 700; min-height: 60px; padding: 10px 32px; border-radius: 20px;
         border: none; background: var(--go); color: #fff; box-shadow: 0 6px 0 var(--go-edge); }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-edge); }
  .big.alt { background: var(--alt); box-shadow: 0 6px 0 var(--alt-edge); }
  #next { visibility: hidden; }

  /* ---------- Done ---------- */
  /* Flex (not grid) so an odd last row stays centred */
  #learned { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; max-width: 760px; margin: 8px 0; }
  .learned { flex: 0 0 clamp(96px, 27vw, 136px); background: var(--card); border-radius: 20px; padding: 10px;
             font-size: clamp(20px, 4vw, 26px); border: none; box-shadow: 0 5px 0 var(--card-edge); }
  .learned span { display: block; font-size: clamp(44px, 10vw, 64px); line-height: 1.2; }
  .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }

  /* ---------- Wide or landscape screens: picture on the left, spelling on the right ---------- */
  @media (orientation: landscape) and (min-width: 640px) {
    :root {
      --pic: clamp(84px, min(20vw, 36vh), 280px);
      --tile-size: clamp(52px, min(8vw, 14vh), 116px);
      --slot-w: clamp(44px, min(7vw, 12vh), 100px);
    }
    #top { max-width: 1040px; }
    .stage { flex-direction: row; justify-content: center; gap: clamp(24px, 6vw, 96px); }
    .picture { flex: 0 0 auto; }
    .spell { width: auto; flex: 0 1 auto; min-width: 0; }
    #pic { padding: 16px clamp(24px, 3vw, 48px); }
  }

  /* Large desktop screens: scale the headings and start screen up too */
  @media (min-width: 1200px) and (min-height: 760px) {
    h1 { font-size: 68px; }
    p { font-size: 28px; }
    #start .mascot { font-size: 170px; }
    #today-row { font-size: 64px; }
    #top { font-size: 30px; }
    .hint-text { font-size: 21px; }
  }

  /* Phones held sideways: tighten vertical spacing */
  @media (orientation: landscape) and (max-height: 500px) {
    .screen.on { gap: 6px; }
    .hint-text { display: none; }
    #start .mascot { font-size: 64px; }
    h1 { font-size: 34px; }
    p { font-size: 18px; }
    .learned { flex-basis: 104px; padding: 6px; font-size: 20px; }
    .learned span { font-size: 40px; }
    .big { min-height: 52px; padding: 6px 26px; font-size: 22px; }
  }

  /* Mouse and keyboard: say so */
  @media (hover: hover) and (pointer: fine) {
    .kbd { display: inline; }
    .tile:hover, .big:hover, #pic:hover, .learned:hover { filter: brightness(1.08); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  @keyframes bounce { 30% { transform: translateY(-20px) scale(1.06); } 60% { transform: translateY(0); } }
</style>
</head>
<body>

<!-- Start screen: a tap is needed before browsers allow speech -->
<main id="start" class="screen on">
  <div class="mascot" aria-hidden="true">🦉</div>
  <h1>Daily Words</h1>
  <p id="today-label"></p>
  <div id="today-row" aria-hidden="true"></div>
  <p id="streak-label"></p>
  <button class="big" id="go" onclick="begin()">▶ Let's go!</button>
  <p class="hint-text kbd">or press Enter</p>
</main>

<!-- Play screen -->
<main id="play" class="screen">
  <header id="top">
    <span id="stars" aria-label="Stars">⭐ 0</span>
    <div id="dots" aria-hidden="true"></div>
    <span id="streak" aria-label="Days in a row">🔥 0</span>
  </header>
  <div class="stage">
    <section class="picture">
      <button id="pic" aria-label="Hear the word again"></button>
      <div class="hint-text">Tap the picture to hear it<span class="kbd"> · or press Space</span></div>
    </section>
    <section class="spell">
      <div id="slots" aria-hidden="true"></div>
      <div id="tiles"></div>
      <div id="msg" aria-live="polite"></div>
      <button id="next" class="big" onclick="nextWord()">Next ➜</button>
      <div class="hint-text kbd">Type the letters on your keyboard too</div>
    </section>
  </div>
</main>

<!-- Finished screen -->
<main id="done" class="screen">
  <h1>🎉 You did it! 🎉</h1>
  <p>Today you learned:</p>
  <div id="learned"></div>
  <p id="done-streak"></p>
  <p>Come back tomorrow for new words!</p>
  <div class="buttons">
    <button class="big" onclick="playAgain()">🔁 Play again</button>
    <button class="big alt" onclick="bonusWord()">🎁 Bonus word</button>
  </div>
</main>

<script>
  // ---------- Word bank ----------
  // Easy words (3 letters) and harder words (4–5 letters), each with a picture and a short sentence.
  const EASY = [
    { w: "cat", pic: "🐱", s: "The cat says meow." },
    { w: "dog", pic: "🐶", s: "The dog says woof." },
    { w: "sun", pic: "☀️", s: "The sun is hot." },
    { w: "bus", pic: "🚌", s: "We ride the bus." },
    { w: "pig", pic: "🐷", s: "The pig is pink." },
    { w: "cow", pic: "🐮", s: "The cow says moo." },
    { w: "bed", pic: "🛏️", s: "I sleep in my bed." },
    { w: "egg", pic: "🥚", s: "The hen lays an egg." },
    { w: "box", pic: "📦", s: "The toy is in the box." },
    { w: "fox", pic: "🦊", s: "The fox is orange." },
    { w: "bee", pic: "🐝", s: "The bee says buzz." },
    { w: "ant", pic: "🐜", s: "The ant is small." },
    { w: "owl", pic: "🦉", s: "The owl says hoot." },
    { w: "key", pic: "🔑", s: "The key opens the door." },
    { w: "car", pic: "🚗", s: "The car goes fast." },
    { w: "hat", pic: "🎩", s: "I wear a hat." },
    { w: "cup", pic: "🥤", s: "I drink from a cup." },
    { w: "red", pic: "🔴", s: "The apple is red." },
    { w: "hot", pic: "🔥", s: "Fire is hot." },
    { w: "ice", pic: "🧊", s: "Ice is cold." },
    { w: "run", pic: "🏃", s: "I can run fast." },
    { w: "yes", pic: "👍", s: "Yes, please." },
    { w: "map", pic: "🗺️", s: "Look at the map." },
    { w: "bat", pic: "🦇", s: "The bat flies at night." },
    { w: "pen", pic: "🖊️", s: "I write with a pen." },
    { w: "zoo", pic: "🦒", s: "We see animals at the zoo." },
    { w: "web", pic: "🕸️", s: "The spider makes a web." },
    { w: "toy", pic: "🧸", s: "I play with my toy." }
  ];
  const HARD = [
    { w: "ball", pic: "⚽", s: "Kick the ball." },
    { w: "fish", pic: "🐟", s: "The fish can swim." },
    { w: "frog", pic: "🐸", s: "The frog can jump." },
    { w: "duck", pic: "🦆", s: "The duck says quack." },
    { w: "cake", pic: "🎂", s: "I like birthday cake." },
    { w: "book", pic: "📖", s: "I read a book." },
    { w: "star", pic: "⭐", s: "The star shines at night." },
    { w: "moon", pic: "🌙", s: "The moon is in the sky." },
    { w: "tree", pic: "🌳", s: "The tree is tall." },
    { w: "ship", pic: "🚢", s: "The ship sails on the sea." },
    { w: "milk", pic: "🥛", s: "I drink milk." },
    { w: "bird", pic: "🐦", s: "The bird can fly." },
    { w: "door", pic: "🚪", s: "Open the door." },
    { w: "hand", pic: "✋", s: "Wave your hand." },
    { w: "rain", pic: "🌧️", s: "The rain is wet." },
    { w: "lion", pic: "🦁", s: "The lion says roar." },
    { w: "bear", pic: "🐻", s: "The bear is big." },
    { w: "shoe", pic: "👟", s: "Put on your shoe." },
    { w: "sock", pic: "🧦", s: "I have a red sock." },
    { w: "stop", pic: "🛑", s: "Stop at the red light." },
    { w: "apple", pic: "🍎", s: "I eat an apple." },
    { w: "house", pic: "🏠", s: "This is my house." },
    { w: "horse", pic: "🐴", s: "The horse can run." },
    { w: "train", pic: "🚆", s: "The train goes choo choo." },
    { w: "bread", pic: "🍞", s: "I eat bread." },
    { w: "snake", pic: "🐍", s: "The snake says hiss." },
    { w: "mouse", pic: "🐭", s: "The mouse says squeak." },
    { w: "plane", pic: "✈️", s: "The plane flies high." },
    { w: "smile", pic: "😊", s: "I smile when I am happy." },
    { w: "heart", pic: "❤️", s: "I love you with all my heart." }
  ];
  const EASY_PER_DAY = 3, HARD_PER_DAY = 2;

  // ---------- Daily selection ----------
  // Each word list is shuffled once with a fixed seed, then each day takes the next slice,
  // so every word appears before any word repeats and everyone gets the same words on the same day.
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed) {
    const a = arr.slice(), r = rng(seed);
    for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; }
    return a;
  }
  function slice(list, count, day, seed) {
    const order = seededShuffle(list, seed), out = [];
    for (let k = 0; k < count; k++) out.push(order[(day * count + k) % order.length]);
    return out;
  }
  const now = new Date();
  const dateKey = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  const todayKey = dateKey(now);
  const yesterdayKey = (() => { const d = new Date(now); d.setDate(d.getDate() - 1); return dateKey(d); })();
  const dayNum = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  const todaysWords = slice(EASY, EASY_PER_DAY, dayNum, 7).concat(slice(HARD, HARD_PER_DAY, dayNum, 11));

  // ---------- Saved progress (best effort; the game works without it) ----------
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  let progress = load("dw-progress", { stars: 0, streak: 0, lastDay: null });
  let doneToday = load("dw-day-" + todayKey, []);

  // ---------- Speech ----------
  let voice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /en[-_]US/i.test(v.lang) && /female|samantha|google/i.test(v.name))
         || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text, rate) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate || 0.8; u.pitch = 1.1;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  // ---------- Game ----------
  let list = todaysWords, i = 0, typed = "", misses = 0, bonus = false;
  const $ = id => document.getElementById(id);
  const cheers = ["Great job!", "Super!", "Well done!", "Awesome!", "You did it!", "Fantastic!"];
  let screen = "start";

  function show(id) {
    screen = id;
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
    window.scrollTo(0, 0);
  }

  function begin() {
    say("Hello! Let's learn some words.");
    i = todaysWords.findIndex(x => !doneToday.includes(x.w));
    if (i === -1) { showDone(); return; }
    list = todaysWords; bonus = false;
    show("play");
    loadWord(false);
    setTimeout(sayWord, 1400);
  }

  function shuffle(letters) {
    const word = letters.join("");
    let out = seededShuffle(letters, Math.floor(Math.random() * 1e9));
    for (let tries = 0; tries < 20 && letters.length > 1 && out.join("") === word; tries++)
      out = seededShuffle(letters, Math.floor(Math.random() * 1e9));
    return out;
  }

  function renderTop() {
    $("stars").textContent = "⭐ " + progress.stars;
    $("streak").textContent = "🔥 " + progress.streak;
    const dots = $("dots"); dots.innerHTML = "";
    if (bonus) { dots.textContent = "🎁"; return; }
    todaysWords.forEach((x, k) => {
      const d = document.createElement("div");
      d.className = "dot" + (doneToday.includes(x.w) ? " done" : "") + (k === i ? " now" : "");
      dots.appendChild(d);
    });
  }

  function loadWord(speak) {
    const cur = list[i];
    typed = ""; misses = 0;
    renderTop();
    $("pic").textContent = cur.pic;
    $("msg").textContent = "";
    $("next").style.visibility = "hidden";

    const slots = $("slots"); slots.innerHTML = "";
    cur.w.toUpperCase().split("").forEach(l => {
      const s = document.createElement("div");
      s.className = "slot"; s.textContent = l; // faint letter as a guide
      slots.appendChild(s);
    });

    const box = $("tiles"); box.innerHTML = "";
    shuffle(cur.w.toUpperCase().split("")).forEach(l => {
      const b = document.createElement("button");
      b.className = "tile"; b.textContent = l;
      b.setAttribute("aria-label", "Letter " + l);
      b.onclick = () => tap(l, b);
      box.appendChild(b);
    });
    if (speak !== false) sayWord();
  }

  function sayWord() {
    const cur = list[i];
    $("pic").classList.remove("bounce"); void $("pic").offsetWidth; $("pic").classList.add("bounce");
    say(cur.w + ". " + cur.s + " " + cur.w + ".");
  }

  function tap(letter, btn) {
    const target = list[i].w.toUpperCase();
    if (typed === target || btn.classList.contains("used")) return;
    if (letter === target[typed.length]) {
      say(letter, 1);
      document.querySelectorAll(".tile.hint").forEach(t => t.classList.remove("hint"));
      $("slots").children[typed.length].classList.add("filled");
      typed += letter; misses = 0;
      btn.classList.add("used");
      if (typed === target) finishWord();
    } else {
      say("Oops! Try again.", 1);
      btn.classList.add("wrong");
      setTimeout(() => btn.classList.remove("wrong"), 400);
      if (++misses >= 2) showHint();
    }
  }

  function showHint() {
    const need = list[i].w.toUpperCase()[typed.length];
    const tile = [...document.querySelectorAll(".tile:not(.used)")].find(t => t.textContent === need);
    if (tile) tile.classList.add("hint");
  }

  function finishWord() {
    const cur = list[i];
    const cheer = cheers[Math.floor(Math.random() * cheers.length)];
    $("msg").textContent = "🎉 " + cheer + " ⭐";
    progress.stars++;
    if (!bonus && !doneToday.includes(cur.w)) { doneToday.push(cur.w); save("dw-day-" + todayKey, doneToday); }
    if (!bonus && doneToday.length === todaysWords.length && progress.lastDay !== todayKey) {
      progress.streak = progress.lastDay === yesterdayKey ? progress.streak + 1 : 1;
      progress.lastDay = todayKey;
    }
    save("dw-progress", progress);
    renderTop();
    setTimeout(() => say(cheer + " " + cur.w.split("").join(", ") + ". " + cur.w + "!"), 500);
    $("next").style.visibility = "visible";
    $("next").focus({ preventScroll: true });
  }

  function nextWord() {
    if (bonus) { bonusWord(); return; }
    const k = todaysWords.findIndex(x => !doneToday.includes(x.w));
    if (k === -1) { showDone(); return; }
    i = k; loadWord();
  }

  function showDone() {
    show("done");
    const box = $("learned"); box.innerHTML = "";
    todaysWords.forEach(x => {
      const b = document.createElement("button");
      b.className = "learned";
      b.innerHTML = "<span>" + x.pic + "</span>" + x.w;
      b.onclick = () => say(x.w + ". " + x.s);
      box.appendChild(b);
    });
    $("done-streak").textContent = "🔥 " + progress.streak + " day" + (progress.streak === 1 ? "" : "s") + " in a row!  ⭐ " + progress.stars + " stars";
    say("You did it! You learned " + todaysWords.length + " words today. Tap a picture to hear it again.");
  }

  function playAgain() {
    list = todaysWords; bonus = false;
    doneToday = []; save("dw-day-" + todayKey, doneToday);
    i = 0; show("play"); loadWord();
  }

  function bonusWord() {
    const pool = EASY.concat(HARD).filter(x => !todaysWords.includes(x) && x !== list[i]);
    list = [pool[Math.floor(Math.random() * pool.length)]];
    i = 0; bonus = true; show("play"); loadWord();
  }

  // ---------- Keyboard (desktop) ----------
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (screen === "start" && e.key === "Enter") { e.preventDefault(); begin(); return; }
    if (screen !== "play") return;
    if (e.key === " ") { e.preventDefault(); sayWord(); return; }
    if (e.key === "Enter" && $("next").style.visibility === "visible") { e.preventDefault(); nextWord(); return; }
    if (/^[a-z]$/i.test(e.key)) {
      const L = e.key.toUpperCase();
      const free = [...document.querySelectorAll(".tile:not(.used)")].filter(t => t.textContent === L);
      if (free.length) tap(L, free[0]);
    }
  });

  $("pic").onclick = sayWord;

  // Start screen labels
  const finished = doneToday.length >= todaysWords.length;
  $("today-label").textContent = finished ? "You finished today's words! 🌟" : todaysWords.length + " new words today:";
  $("today-row").textContent = todaysWords.map(x => x.pic).join(" ");
  $("streak-label").textContent = progress.streak ? "🔥 " + progress.streak + " day streak  ·  ⭐ " + progress.stars + " stars" : "";
</script>
</body>
</html>
